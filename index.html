<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SMOKY - Efeito Fumaça Realista</title>
    <style>
        /* ===================================================================== */
        /* RESET E CONFIGURAÇÕES GLOBAIS                                         */
        /* ===================================================================== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===================================================================== */
        /* CORPO DA PÁGINA - FUNDO PRETO                                        */
        /* ===================================================================== */
        
        body {
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ===================================================================== */
        /* CONTAINER PRINCIPAL                                                   */
        /* ===================================================================== */
        
        .smoky-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* ===================================================================== */
        /* PALAVRA SMOKY - ESTRUTURA EM FLEX                                     */
        /* ===================================================================== */
        
        .smoky-word {
            font-family: 'Arial Black', 'Impact', 'Segoe UI Black', 'Helvetica Neue', sans-serif;
            font-size: clamp(70px, 12vw, 120px);
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            letter-spacing: clamp(8px, 2vw, 15px);
            position: relative;
            user-select: none;
        }

        /* ===================================================================== */
        /* CADA LETRA INDIVIDUAL                                                 */
        /* ===================================================================== */
        
        .letter {
            display: inline-block;
            position: relative;
            will-change: transform, opacity, filter;
            font-style: normal;
        }

        /* ===================================================================== */
        /* ANIMAÇÃO DE DISSIPAÇÃO EM FUMAÇA - TRAJETÓRIA ORGÂNICA               */
        /* A fumaça sobe e vai para a direita em um movimento suave e contínuo  */
        /* COM MAIS DESFOQUE E INCLINAÇÃO DE 10 GRAUS NA FONTE                  */
        /* ===================================================================== */
        
        @keyframes smokeDissolve {
            0% {
                opacity: 1;
                transform: translate(0px, 0px) scale(1) rotate(0deg);
                filter: blur(0px);
                text-shadow: 0 0 0px rgba(255,255,255,0);
                font-style: normal;
            }
            5% {
                opacity: 0.98;
                transform: translate(2px, -3px) scale(1.02) rotate(1deg);
                filter: blur(1.5px);
                text-shadow: 0 0 1px rgba(255,255,255,0.1);
                font-style: oblique(1deg);
            }
            10% {
                opacity: 0.95;
                transform: translate(5px, -8px) scale(1.03) rotate(2deg);
                filter: blur(3px);
                text-shadow: 0 0 2px rgba(255,255,255,0.15);
                font-style: oblique(2deg);
            }
            15% {
                opacity: 0.9;
                transform: translate(8px, -14px) scale(1.02) rotate(3deg);
                filter: blur(5px);
                text-shadow: 0 0 3px rgba(200,200,200,0.2);
                font-style: oblique(3deg);
            }
            20% {
                opacity: 0.84;
                transform: translate(12px, -21px) scale(0.98) rotate(4deg);
                filter: blur(7px);
                text-shadow: 0 0 5px rgba(180,180,180,0.25);
                font-style: oblique(4deg);
            }
            25% {
                opacity: 0.77;
                transform: translate(16px, -29px) scale(0.93) rotate(5deg);
                filter: blur(9px);
                text-shadow: 0 0 7px rgba(160,160,160,0.3);
                font-style: oblique(5deg);
            }
            30% {
                opacity: 0.69;
                transform: translate(21px, -38px) scale(0.87) rotate(6deg);
                filter: blur(11px);
                text-shadow: 0 0 9px rgba(140,140,140,0.35);
                font-style: oblique(6deg);
            }
            35% {
                opacity: 0.6;
                transform: translate(26px, -48px) scale(0.8) rotate(7deg);
                filter: blur(13px);
                text-shadow: 0 0 11px rgba(120,120,120,0.4);
                font-style: oblique(7deg);
            }
            40% {
                opacity: 0.51;
                transform: translate(32px, -59px) scale(0.73) rotate(8deg);
                filter: blur(15px);
                text-shadow: 0 0 13px rgba(100,100,100,0.42);
                font-style: oblique(8deg);
            }
            45% {
                opacity: 0.42;
                transform: translate(38px, -71px) scale(0.66) rotate(9deg);
                filter: blur(17px);
                text-shadow: 0 0 15px rgba(90,90,90,0.44);
                font-style: oblique(9deg);
            }
            50% {
                opacity: 0.34;
                transform: translate(44px, -84px) scale(0.59) rotate(10deg);
                filter: blur(19px);
                text-shadow: 0 0 17px rgba(80,80,80,0.45);
                font-style: oblique(10deg);
            }
            55% {
                opacity: 0.27;
                transform: translate(50px, -97px) scale(0.52) rotate(10deg);
                filter: blur(21px);
                text-shadow: 0 0 19px rgba(70,70,70,0.44);
                font-style: oblique(10deg);
            }
            60% {
                opacity: 0.21;
                transform: translate(56px, -110px) scale(0.46) rotate(10deg);
                filter: blur(23px);
                text-shadow: 0 0 21px rgba(60,60,60,0.42);
                font-style: oblique(10deg);
            }
            65% {
                opacity: 0.16;
                transform: translate(62px, -123px) scale(0.4) rotate(10deg);
                filter: blur(25px);
                text-shadow: 0 0 23px rgba(50,50,50,0.38);
                font-style: oblique(10deg);
            }
            70% {
                opacity: 0.12;
                transform: translate(68px, -136px) scale(0.35) rotate(10deg);
                filter: blur(27px);
                text-shadow: 0 0 24px rgba(40,40,40,0.33);
                font-style: oblique(10deg);
            }
            75% {
                opacity: 0.08;
                transform: translate(74px, -149px) scale(0.3) rotate(10deg);
                filter: blur(29px);
                text-shadow: 0 0 25px rgba(30,30,30,0.27);
                font-style: oblique(10deg);
            }
            80% {
                opacity: 0.05;
                transform: translate(80px, -161px) scale(0.26) rotate(10deg);
                filter: blur(31px);
                text-shadow: 0 0 26px rgba(20,20,20,0.2);
                font-style: oblique(10deg);
            }
            90% {
                opacity: 0.02;
                transform: translate(86px, -173px) scale(0.23) rotate(10deg);
                filter: blur(33px);
                text-shadow: 0 0 27px rgba(10,10,10,0.12);
                font-style: oblique(10deg);
            }
            100% {
                opacity: 0;
                transform: translate(92px, -185px) scale(0.2) rotate(10deg);
                filter: blur(35px);
                text-shadow: 0 0 28px rgba(0,0,0,0);
                visibility: hidden;
                font-style: oblique(10deg);
            }
        }

        /* ===================================================================== */
        /* ANIMAÇÃO DE CONDENSAÇÃO DA FUMAÇA - VOLTA NATURAL                    */
        /* A fumaça se condensa gradualmente até formar a palavra novamente    */
        /* ===================================================================== */
        
        @keyframes smokeCondense {
            0% {
                opacity: 0;
                transform: translate(92px, -185px) scale(0.2) rotate(10deg);
                filter: blur(35px);
                text-shadow: 0 0 28px rgba(0,0,0,0);
                visibility: visible;
                font-style: oblique(10deg);
            }
            5% {
                opacity: 0.02;
                transform: translate(88px, -178px) scale(0.22) rotate(9deg);
                filter: blur(33px);
                text-shadow: 0 0 26px rgba(10,10,10,0.08);
                font-style: oblique(9deg);
            }
            10% {
                opacity: 0.05;
                transform: translate(84px, -170px) scale(0.24) rotate(8deg);
                filter: blur(31px);
                text-shadow: 0 0 25px rgba(20,20,20,0.15);
                font-style: oblique(8deg);
            }
            15% {
                opacity: 0.09;
                transform: translate(80px, -162px) scale(0.27) rotate(7deg);
                filter: blur(29px);
                text-shadow: 0 0 24px rgba(30,30,30,0.22);
                font-style: oblique(7deg);
            }
            20% {
                opacity: 0.14;
                transform: translate(75px, -153px) scale(0.3) rotate(6deg);
                filter: blur(27px);
                text-shadow: 0 0 23px rgba(40,40,40,0.28);
                font-style: oblique(6deg);
            }
            25% {
                opacity: 0.2;
                transform: translate(70px, -143px) scale(0.34) rotate(5deg);
                filter: blur(25px);
                text-shadow: 0 0 22px rgba(50,50,50,0.34);
                font-style: oblique(5deg);
            }
            30% {
                opacity: 0.27;
                transform: translate(65px, -132px) scale(0.38) rotate(4deg);
                filter: blur(23px);
                text-shadow: 0 0 21px rgba(60,60,60,0.4);
                font-style: oblique(4deg);
            }
            35% {
                opacity: 0.35;
                transform: translate(59px, -120px) scale(0.43) rotate(3deg);
                filter: blur(21px);
                text-shadow: 0 0 20px rgba(70,70,70,0.45);
                font-style: oblique(3deg);
            }
            40% {
                opacity: 0.44;
                transform: translate(53px, -108px) scale(0.48) rotate(2deg);
                filter: blur(19px);
                text-shadow: 0 0 19px rgba(80,80,80,0.49);
                font-style: oblique(2deg);
            }
            45% {
                opacity: 0.53;
                transform: translate(47px, -95px) scale(0.54) rotate(1deg);
                filter: blur(17px);
                text-shadow: 0 0 17px rgba(90,90,90,0.52);
                font-style: oblique(1deg);
            }
            50% {
                opacity: 0.62;
                transform: translate(41px, -82px) scale(0.6) rotate(0deg);
                filter: blur(15px);
                text-shadow: 0 0 15px rgba(100,100,100,0.54);
                font-style: normal;
            }
            55% {
                opacity: 0.71;
                transform: translate(35px, -69px) scale(0.67) rotate(0deg);
                filter: blur(13px);
                text-shadow: 0 0 13px rgba(110,110,110,0.55);
                font-style: normal;
            }
            60% {
                opacity: 0.79;
                transform: translate(29px, -56px) scale(0.74) rotate(0deg);
                filter: blur(11px);
                text-shadow: 0 0 11px rgba(120,120,120,0.55);
                font-style: normal;
            }
            65% {
                opacity: 0.86;
                transform: translate(23px, -44px) scale(0.81) rotate(0deg);
                filter: blur(9px);
                text-shadow: 0 0 9px rgba(130,130,130,0.54);
                font-style: normal;
            }
            70% {
                opacity: 0.91;
                transform: translate(17px, -33px) scale(0.88) rotate(0deg);
                filter: blur(7px);
                text-shadow: 0 0 7px rgba(140,140,140,0.5);
                font-style: normal;
            }
            75% {
                opacity: 0.95;
                transform: translate(12px, -23px) scale(0.94) rotate(0deg);
                filter: blur(5px);
                text-shadow: 0 0 5px rgba(160,160,160,0.42);
                font-style: normal;
            }
            80% {
                opacity: 0.98;
                transform: translate(7px, -14px) scale(0.98) rotate(0deg);
                filter: blur(3px);
                text-shadow: 0 0 3px rgba(180,180,180,0.3);
                font-style: normal;
            }
            85% {
                opacity: 0.99;
                transform: translate(4px, -7px) scale(0.99) rotate(0deg);
                filter: blur(2px);
                text-shadow: 0 0 1.5px rgba(200,200,200,0.18);
                font-style: normal;
            }
            90% {
                opacity: 1;
                transform: translate(1px, -2px) scale(1) rotate(0deg);
                filter: blur(0.5px);
                text-shadow: 0 0 0.5px rgba(220,220,220,0.08);
                font-style: normal;
            }
            100% {
                opacity: 1;
                transform: translate(0px, 0px) scale(1) rotate(0deg);
                filter: blur(0px);
                text-shadow: 0 0 0px rgba(255,255,255,0);
                font-style: normal;
            }
        }

        /* ===================================================================== */
        /* CLASSES DE ANIMAÇÃO                                                   */
        /* ===================================================================== */
        
        .letter.dissolving {
            animation: smokeDissolve 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            pointer-events: none;
        }

        .letter.returning {
            animation: smokeCondense 1.1s cubic-bezier(0.2, 0.85, 0.4, 1.05) forwards;
        }

        /* ===================================================================== */
        /* EFEITO DE GLOW SUTIL QUANDO A PALAVRA ESTÁ VISÍVEL                   */
        /* ===================================================================== */
        
        @keyframes gentlePulse {
            0% {
                text-shadow: 0 0 2px rgba(255,255,255,0.15), 0 0 4px rgba(255,255,255,0.08);
            }
            100% {
                text-shadow: 0 0 6px rgba(255,255,255,0.25), 0 0 12px rgba(255,255,255,0.12);
            }
        }
        
        .smoky-word:not(.processing) .letter:not(.dissolving):not(.returning) {
            animation: gentlePulse 2s ease-in-out infinite alternate;
        }

        /* ===================================================================== */
        /* RESPONSIVIDADE - AJUSTES PARA DIFERENTES TELAS                       */
        /* ===================================================================== */
        
        @media (max-width: 768px) {
            .smoky-word {
                letter-spacing: 8px;
            }
            
            @keyframes smokeDissolve {
                0% { transform: translate(0px, 0px) scale(1); filter: blur(0px); }
                100% { transform: translate(50px, -100px) scale(0.2); filter: blur(25px); }
            }
            
            @keyframes smokeCondense {
                0% { transform: translate(50px, -100px) scale(0.2); filter: blur(25px); }
                100% { transform: translate(0px, 0px) scale(1); filter: blur(0px); }
            }
        }

        @media (max-width: 480px) {
            .smoky-word {
                letter-spacing: 5px;
            }
            
            @keyframes smokeDissolve {
                0% { transform: translate(0px, 0px) scale(1); filter: blur(0px); }
                100% { transform: translate(35px, -70px) scale(0.2); filter: blur(25px); }
            }
            
            @keyframes smokeCondense {
                0% { transform: translate(35px, -70px) scale(0.2); filter: blur(25px); }
                100% { transform: translate(0px, 0px) scale(1); filter: blur(0px); }
            }
        }
    </style>
</head>
<body>
    <div class="smoky-container">
        <div id="smokyWord" class="smoky-word">
            <span class="letter" data-letter="0">S</span>
            <span class="letter" data-letter="1">M</span>
            <span class="letter" data-letter="2">O</span>
            <span class="letter" data-letter="3">K</span>
            <span class="letter" data-letter="4">Y</span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            // Elementos do DOM
            const smokyWord = document.getElementById('smokyWord');
            const letters = document.querySelectorAll('.letter');
            const container = document.querySelector('.smoky-container');
            
            // Estado do sistema
            let isHovering = false;
            let isDissolving = false;
            let isCondensing = false;
            let currentLetterIndex = 0;
            let dissolveTimer = null;
            let condenseTimer = null;
            let pendingDissolve = false;
            
            // Configurações de timing
            const LETTER_DELAY = 220;
            const ANIMATION_DURATION = 1100;
            const SAFETY_TIMEOUT = 2000;
            
            function forceReflow(element) {
                if (!element) return;
                void element.offsetHeight;
                void element.offsetWidth;
            }
            
            function clearAllTimers() {
                if (dissolveTimer) {
                    clearInterval(dissolveTimer);
                    dissolveTimer = null;
                }
                if (condenseTimer) {
                    clearInterval(condenseTimer);
                    condenseTimer = null;
                }
            }
            
            function removeAllAnimationClasses() {
                letters.forEach(letter => {
                    letter.classList.remove('dissolving');
                    letter.classList.remove('returning');
                    forceReflow(letter);
                });
            }
            
            function resetToNormalState() {
                clearAllTimers();
                removeAllAnimationClasses();
                isDissolving = false;
                isCondensing = false;
                isHovering = false;
                currentLetterIndex = 0;
                pendingDissolve = false;
                
                letters.forEach(letter => {
                    letter.style.opacity = '';
                    letter.style.visibility = '';
                });
            }
            
            // Função para desaparecer - ordem S, M, O, K, Y
            function startDissolve() {
                if (isDissolving) return;
                
                if (isCondensing) {
                    pendingDissolve = true;
                    return;
                }
                
                clearAllTimers();
                removeAllAnimationClasses();
                forceReflow(smokyWord);
                
                isDissolving = true;
                isCondensing = false;
                isHovering = true;
                currentLetterIndex = 0;
                
                dissolveTimer = setInterval(() => {
                    if (currentLetterIndex < letters.length) {
                        const currentLetter = letters[currentLetterIndex];
                        currentLetter.classList.remove('returning');
                        forceReflow(currentLetter);
                        currentLetter.classList.add('dissolving');
                        currentLetterIndex++;
                    } else {
                        clearInterval(dissolveTimer);
                        dissolveTimer = null;
                        isDissolving = false;
                    }
                }, LETTER_DELAY);
            }
            
            // Função para aparecer - ordem S, M, O, K, Y (mesma ordem)
            function startCondense() {
                if (!isHovering && !isDissolving) return;
                
                if (isCondensing) return;
                
                clearAllTimers();
                
                if (isDissolving) {
                    if (dissolveTimer) {
                        clearInterval(dissolveTimer);
                        dissolveTimer = null;
                    }
                    
                    for (let i = currentLetterIndex; i < letters.length; i++) {
                        letters[i].classList.remove('dissolving');
                        forceReflow(letters[i]);
                    }
                    
                    isDissolving = false;
                }
                
                isCondensing = true;
                isHovering = false;
                
                // Mesma ordem: S, M, O, K, Y
                let index = 0;
                
                condenseTimer = setInterval(() => {
                    if (index < letters.length) {
                        const currentLetter = letters[index];
                        currentLetter.classList.remove('dissolving');
                        forceReflow(currentLetter);
                        currentLetter.classList.add('returning');
                        index++;
                    } else {
                        clearInterval(condenseTimer);
                        condenseTimer = null;
                        isCondensing = false;
                        
                        setTimeout(() => {
                            letters.forEach(letter => {
                                letter.classList.remove('returning');
                            });
                            
                            if (pendingDissolve) {
                                pendingDissolve = false;
                                setTimeout(() => startDissolve(), 50);
                            }
                        }, ANIMATION_DURATION);
                    }
                }, LETTER_DELAY);
            }
            
            function setupEventListeners() {
                if (!container || !smokyWord) return;
                
                container.addEventListener('mouseenter', (e) => {
                    e.stopPropagation();
                    startDissolve();
                });
                
                container.addEventListener('mouseleave', (e) => {
                    e.stopPropagation();
                    startCondense();
                });
                
                smokyWord.addEventListener('mouseenter', (e) => {
                    e.stopPropagation();
                    startDissolve();
                });
                
                smokyWord.addEventListener('mouseleave', (e) => {
                    e.stopPropagation();
                    startCondense();
                });
                
                container.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    startDissolve();
                });
                
                container.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    startCondense();
                });
            }
            
            function setupErrorPrevention() {
                window.addEventListener('beforeunload', () => {
                    clearAllTimers();
                });
                
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        const anyAnimating = Array.from(letters).some(
                            l => l.classList.contains('dissolving') || l.classList.contains('returning')
                        );
                        
                        if (!anyAnimating && (isDissolving || isCondensing)) {
                            resetToNormalState();
                        }
                    }
                });
            }
            
            function init() {
                if (!letters.length) return;
                setupEventListeners();
                setupErrorPrevention();
                resetToNormalState();
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
